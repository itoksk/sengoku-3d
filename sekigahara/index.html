<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>関ヶ原の戦い 3D俯瞰デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(238,240,235,0.9);
  --ink:#1c2026; --sub:#4d5560; --rule:rgba(28,32,38,.16);
  --kin:#9a7a2c;
  --btn:rgba(28,32,38,.07); --btnh:rgba(28,32,38,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel: rgba(20,23,28,0.86);
    --ink:#eef0ea; --sub:#a9b0b8; --rule:rgba(238,240,234,.14);
    --kin:#d4b25e;
    --btn:rgba(255,255,255,.08); --btnh:rgba(255,255,255,.16);
  }
}
:root[data-theme="dark"]{
  --panel: rgba(20,23,28,0.86);
  --ink:#eef0ea; --sub:#a9b0b8; --rule:rgba(238,240,234,.14);
  --kin:#d4b25e;
  --btn:rgba(255,255,255,.08); --btnh:rgba(255,255,255,.16);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:#1d2740;color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:6px;pointer-events:auto;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.title{padding:12px 16px 12px 14px;border-left:4px solid var(--kin);max-width:min(440px,62vw)}
.title h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;
  font-size:clamp(20px,3.2vw,30px);letter-spacing:.08em;margin:0;line-height:1.2}
.title p{margin:4px 0 0;font-size:12px;color:var(--sub);line-height:1.5}
.title a{color:var(--sub)}
.legend{padding:10px 14px;font-size:12px;line-height:1.9;min-width:150px}
.legend .row{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:2px;flex:none}
.sw.e{background:#2c4fb0}.sw.w{background:#c0281f}.sw.t{background:#8b3fc4}
.legend .hint{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule);color:var(--sub);font-size:11px;line-height:1.6}
.card{align-self:center;width:min(780px,100%);padding:14px 18px 12px}
.meta{display:flex;align-items:baseline;gap:12px;color:var(--sub);font-size:12px}
.meta .act{font-family:"Shippori Mincho",serif;font-weight:800;font-size:15px;color:var(--kin)}
.card h2{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;
  font-size:clamp(19px,2.6vw,25px);margin:4px 0 6px;letter-spacing:.05em}
.card p{margin:0;font-size:14px;line-height:1.8;min-height:3.6em;max-width:70ch}
.bar{height:3px;background:var(--rule);margin:12px 0 10px;border-radius:2px;overflow:hidden}
#prog{height:100%;width:0;background:var(--kin)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--btn);border:0;border-radius:4px;height:32px;min-width:36px;padding:0 10px;cursor:pointer}
button:hover{background:var(--btnh)}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
#dots{display:flex;gap:4px;flex:1;min-width:0}
#dots button{flex:1;min-width:0;height:32px;padding:0 4px;font-family:"Shippori Mincho",serif;font-weight:700;font-size:13px;color:var(--sub)}
#dots button.on{background:var(--kin);color:#fff}
#dots button.done{color:var(--ink)}
.note{font-size:11px;color:var(--sub);margin-top:8px}
#loading{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  background:#1d2740;font-family:"Shippori Mincho",serif;font-size:18px;color:#e8ebf2;letter-spacing:.2em;transition:opacity .8s}
@media (max-width:640px){
  .legend{display:none}
  .title{max-width:100%}
  .card{padding:12px 14px 10px}
  .card p{font-size:13px;line-height:1.7;min-height:0}
  #dots button{font-size:12px}
}
@media (prefers-reduced-motion: reduce){ #loading{transition:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="top">
    <div class="panel title">
      <h1>関ヶ原の戦い</h1>
      <p>慶長5年9月15日（1600年10月21日）　徳川家康の東軍と石田三成らの西軍による決戦　<a href="../">一覧へ</a></p>
    </div>
    <div class="panel legend">
      <div class="row"><span class="sw e"></span>東軍</div>
      <div class="row"><span class="sw w"></span>西軍</div>
      <div class="row"><span class="sw t"></span>寝返り</div>
      <div class="hint">ドラッグで視点を回転<br>ホイール・ピンチで拡大縮小<br>ダブルクリックで視点を戻す<br>Space で再生／停止</div>
    </div>
  </div>
  <div class="panel card">
    <div class="meta"><span class="act" id="pact"></span><span id="pdate"></span></div>
    <h2 id="ptitle"></h2>
    <p id="ptext"></p>
    <div class="bar"><div id="prog"></div></div>
    <div class="ctrl">
      <button id="prev" aria-label="前の場面">◀</button>
      <button id="play" aria-label="再生／停止">❚❚</button>
      <button id="next" aria-label="次の場面">▶</button>
      <div id="dots"></div>
      <button id="speed" aria-label="再生速度">1×</button>
    </div>
    <div class="note">通説にもとづく再現です。地形の縮尺・軍勢の数と配置は概念的なもので、細部には諸説があります。</div>
  </div>
</div>
<div id="loading">地形を生成しています</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- 地形 ---------------- */
const WATER=1.6,SIZE=300,SEG=240;
function nz(x,z){return Math.sin(x*0.071+Math.sin(z*0.053)*1.3)*0.5+Math.sin(z*0.089+x*0.031)*0.5+Math.sin((x+z)*0.21)*0.22+Math.sin((x-z)*0.37)*0.1;}
const bump=(x,z,cx,cz,r,h)=>h*Math.exp(-((x-cx)*(x-cx)+(z-cz)*(z-cz))/(r*r));
const fujiX=z=>-27+4*Math.sin(z*0.05);
function H(x,z){
  const n=nz(x,z);
  let h=3+n*0.7;
  h+=smooth(-55,-100,z)*(55+n*10);
  h+=smooth(80,118,z)*(36+n*8);
  const gap=1-0.75*Math.exp(-((z-16)/12)*((z-16)/12));
  h+=smooth(-64,-102,x)*(34+n*6)*gap;
  h+=bump(x,z,-46,-40,10,14)+bump(x,z,-60,2,15,20)+bump(x,z,-5,58,17,44)+bump(x,z,96,44,30,58)+bump(x,z,62,-8,8,9)+bump(x,z,-60,-20,10,9);
  const d=Math.abs(x-fujiX(z));
  h=lerp(h,0.8,(1-smooth(1,3,d))*smooth(-62,-48,z)*(1-smooth(62,76,z)));
  return h;
}
const gy=(x,z)=>Math.max(H(x,z),WATER);

function init(){
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1d2740);
scene.fog=new THREE.Fog(0x1d2740,140,520);
const camera=new THREE.PerspectiveCamera(42,1,0.5,1800);
const hemi=new THREE.HemisphereLight(0xe2ebf3,0x5d4f38,0.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,0.95);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-160;sc.right=160;sc.top=160;sc.bottom=-160;sc.near=10;sc.far=480;
sun.shadow.bias=-0.0006;scene.add(sun);scene.add(sun.target);

// terrain
const tg=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);tg.rotateX(-Math.PI/2);
const tp=tg.attributes.position;
for(let i=0;i<tp.count;i++)tp.setY(i,H(tp.getX(i),tp.getZ(i)));
tg.computeVertexNormals();
const tn=tg.attributes.normal,col=new Float32Array(tp.count*3);
const C=h=>new THREE.Color(h);
const FIELD=[C('#b9a45a'),C('#98a459'),C('#a88f5f'),C('#c2ae66')];
const cGr=C('#7f9750'),cFo=C('#3f5a33'),cFo2=C('#566c3a'),cCl=C('#7e6a4c'),cSa=C('#c9bd98'),tmp=new THREE.Color();
const hash=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);};
for(let i=0;i<tp.count;i++){
  const x=tp.getX(i),z=tp.getZ(i),h=tp.getY(i),slope=1-tn.getY(i);
  const fi=Math.floor(hash(Math.floor((x+300)/9),Math.floor((z+300)/7))*4);
  tmp.copy(FIELD[fi]);
  tmp.lerp(cGr,smooth(4.2,7,h));
  tmp.lerp(C('#000').copy(cFo).lerp(cFo2,(nz(x*1.9,z*1.9)+1.3)/2.6),smooth(8,16,h));
  tmp.lerp(cSa,(1-smooth(1.2,3.4,Math.abs(x-fujiX(z))))*smooth(-62,-48,z)*(1-smooth(62,76,z))*0.9);
  tmp.lerp(cCl,smooth(0.3,0.6,slope)*0.7);
  col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
}
tg.setAttribute('color',new THREE.BufferAttribute(col,3));
const terrain=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.96}));
terrain.receiveShadow=true;scene.add(terrain);
const water=new THREE.Mesh(new THREE.PlaneGeometry(SIZE,SIZE).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x5a8ca3,roughness:.22,metalness:.15,transparent:true,opacity:.88}));
water.position.y=WATER;scene.add(water);

/* ---------------- リボン ---------------- */
function ribbon(pts,width,lift,N){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])),false,'centripetal');
  const P=[];for(let i=0;i<=N;i++)P.push(curve.getPointAt(i/N));
  const acc=[0];for(let i=1;i<=N;i++)acc.push(acc[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].z-P[i-1].z));
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=N;i++){
    const a=P[Math.max(i-1,0)],b=P[Math.min(i+1,N)];
    let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    const cy=gy(P[i].x,P[i].z);P[i].y=cy+lift;
    for(const sg of[-1,1]){const x=P[i].x-tz*width/2*sg,z=P[i].z+tx*width/2*sg;
      pos.push(x,Math.max(gy(x,z),cy)+lift,z);uv.push(acc[i]/(width*2),sg<0?0:1);}
  }
  for(let i=0;i<N;i++){const a=2*i,b=a+1,c=a+2,d=a+3;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  return {g,P,N};
}
const roadM=new THREE.MeshLambertMaterial({color:0xcbb98c,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
const ROADS=[
  [[-150,18],[-100,16],[-68,14],[-40,12],[-20,6],[0,2],[20,-2],[45,-3],[62,0],[80,2],[110,4],[150,6]],
  [[-18,4],[-30,-14],[-42,-28],[-54,-48],[-62,-78],[-68,-150]],
  [[8,2],[18,24],[28,50],[36,80],[43,118],[48,150]],
];
const roadPts=[];
for(const r of ROADS){const rb=ribbon(r,1.4,0.25,300);scene.add(new THREE.Mesh(rb.g,roadM));roadPts.push(...rb.P);}

/* ---------------- ラベル ---------------- */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function makeLabel(text,o={}){
  const fs=o.fs||46,font=`${o.weight||700} ${fs}px ${o.family||'"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif'}`;
  const c=document.createElement('canvas'),x=c.getContext('2d');x.font=font;
  const w=Math.ceil(x.measureText(text).width+fs*1.0),h=Math.ceil(fs*1.6);
  c.width=w;c.height=h;x.font=font;
  x.fillStyle=o.bg||'rgba(22,24,28,.74)';rr(x,2,2,w-4,h-4,6);x.fill();
  if(o.stroke){x.strokeStyle=o.stroke;x.lineWidth=4;x.stroke();}
  x.fillStyle=o.fg||'#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(text,w/2,h/2+fs*0.05);
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;
  const m=new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,depthWrite:false,sizeAttenuation:false,fog:false});
  const s=new THREE.Sprite(m);const sz=o.size||0.03;s.scale.set(sz*w/h,sz,1);s.center.set(0.5,0);s.renderOrder=20;return s;
}
function place(text,x,z,o={},dy=5){const s=makeLabel(text,o);s.position.set(x,gy(x,z)+dy,z);scene.add(s);return s;}
const mt={bg:'rgba(52,64,36,.8)',size:0.028};
const dirStyle={bg:'rgba(245,244,238,.85)',fg:'#20242a',size:0.025,weight:500,family:'"Noto Sans JP",sans-serif'};
const rdStyle={bg:'rgba(120,98,54,.82)',size:0.024};
place('笹尾山',-50,-46,mt,4);
place('天満山',-62,4,mt,4);
place('松尾山',2,64,mt,4);
place('南宮山',98,46,mt,4);
place('桃配山',66,-14,mt,3);
place('藤古川',fujiX(-40),-40,{bg:'rgba(34,78,104,.8)',size:0.024},1.5);
place('中山道',108,4,rdStyle,2);
place('北国街道',-60,-64,rdStyle,2);
place('伊勢街道',38,86,rdStyle,2);
place('関ケ原',12,-6,{bg:'rgba(22,24,28,.7)',size:0.024},4);
place('↑ 伊吹山方面',-50,-110,dirStyle,4);
place('大垣・赤坂方面 →',128,16,dirStyle,4);
place('↓ 伊勢方面',52,128,dirStyle,4);

// 集落
const houseM=new THREE.MeshStandardMaterial({color:0xd9ceb4,roughness:.9});
const roofM=new THREE.MeshStandardMaterial({color:0x3a352f,roughness:.7});
for(let i=0;i<18;i++){const x=2+((i*37)%17),z=-6+((i*23)%12)-2;if(Math.abs(z-(x<20?2:-2))<1.6)continue;
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.7,1,1.3),houseM);b.position.set(x,gy(x,z)+.5,z);b.castShadow=true;scene.add(b);
  const r=new THREE.Mesh(new THREE.ConeGeometry(1.3,.7,4),roofM);r.rotation.y=Math.PI/4;r.position.set(x,gy(x,z)+1.35,z);r.scale.set(1,1,.8);scene.add(r);}

// 樹木
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};
const nearRoad=(x,z)=>{for(let i=0;i<roadPts.length;i+=2){const p=roadPts[i];if(Math.abs(p.x-x)<3&&Math.abs(p.z-z)<3)return true;}return false;};
const trees=[],trees2=[];
for(let n=0;n<9000&&trees.length+trees2.length<2200;n++){
  const x=(rnd()-.5)*SIZE*.96,z=(rnd()-.5)*SIZE*.96,h=H(x,z);
  if(h<2.6)continue;
  if(h<7&&rnd()>.04)continue;
  if(Math.abs(x-fujiX(z))<3)continue;
  if(Math.hypot(x-10,z+2)<12)continue;
  if(nearRoad(x,z))continue;
  (h>14||rnd()<.5?trees:trees2).push([x,h,z,.8+rnd()*.9,rnd()]);
}
function scatter(list,geo,base,alt,yOff){
  const im=new THREE.InstancedMesh(geo,new THREE.MeshStandardMaterial({roughness:.9}),list.length);
  const d=new THREE.Object3D(),c=new THREE.Color(),c1=new THREE.Color(base),c2=new THREE.Color(alt);
  list.forEach((t,i)=>{d.position.set(t[0],t[1]+yOff*t[3],t[2]);d.scale.setScalar(t[3]);d.rotation.y=t[4]*6;d.updateMatrix();im.setMatrixAt(i,d.matrix);c.copy(c1).lerp(c2,t[4]);im.setColorAt(i,c);});
  im.castShadow=true;im.receiveShadow=true;scene.add(im);
}
scatter(trees,new THREE.ConeGeometry(1.1,3.6,6),'#35502b','#4d683a',1.5);
scatter(trees2,new THREE.IcosahedronGeometry(1.6,0),'#5a7438','#8a8a3e',1.4);

/* ---------------- 矢印 ---------------- */
const chev=(function(){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');
  x.fillStyle='rgba(255,255,255,.5)';x.fillRect(0,0,128,64);x.fillStyle='#fff';x.beginPath();
  x.moveTo(26,6);x.lineTo(52,6);x.lineTo(86,32);x.lineTo(52,58);x.lineTo(26,58);x.lineTo(60,32);x.closePath();x.fill();
  const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;return t;})();
class Arrow{
  constructor(pts,color,width,from,until){
    this.from=from;this.until=until==null?from:until;this.op=0;this.prog=0;
    const r=ribbon(pts,width,1.0,170);this.P=r.P;this.N=r.N;
    this.mat=new THREE.MeshBasicMaterial({map:chev,color,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,fog:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
    this.mesh=new THREE.Mesh(r.g,this.mat);this.mesh.renderOrder=4;scene.add(this.mesh);
    const r2=ribbon(pts,width*1.45,0.9,170);
    this.smat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,fog:false,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3});
    this.shadow=new THREE.Mesh(r2.g,this.smat);this.shadow.renderOrder=3;scene.add(this.shadow);
    const hg=new THREE.BufferGeometry();const L=width*1.9,W=width*1.15;
    hg.setAttribute('position',new THREE.Float32BufferAttribute([0,0,-W,L,0,0,0,0,W],3));
    this.hmat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,fog:false});
    this.head=new THREE.Mesh(hg,this.hmat);this.head.renderOrder=5;scene.add(this.head);
  }
  update(cur,tIn,dt){
    const on=cur>=this.from&&cur<=this.until;
    if(on)this.prog=cur>this.from?1:ease(clamp((tIn-0.5)/3.4,0,1));
    else if(cur<this.from)this.prog=0;
    this.op+=((on?1:0)-this.op)*Math.min(1,dt*3);
    const vis=this.op>0.01&&this.prog>0.005;
    this.mesh.visible=this.shadow.visible=this.head.visible=vis;
    if(!vis)return;
    this.mat.opacity=0.95*this.op;this.smat.opacity=0.22*this.op;this.hmat.opacity=this.op;
    const k=Math.max(1,Math.floor(this.prog*this.N));
    this.mesh.geometry.setDrawRange(0,k*6);this.shadow.geometry.setDrawRange(0,k*6);
    const p=this.P[k],q=this.P[k-1];

function setPlaying(v){playing=v;$('play').textContent=v?'❚❚':'▶︎';}
function go(i){
  cur=clamp(i,0,PH.length-1);tIn=0;
  camFrom={t:camNow.t.slice(),d:camNow.d,yaw:camNow.yaw,pitch:camNow.pitch};
  envFrom={bg:envNow.bg.clone(),fn:envNow.fn,ff:envNow.ff,sun:envNow.sun,sunC:envNow.sunC.clone(),hemi:envNow.hemi};
  const p=PH[cur];$('pact').textContent=p.act==='序'||p.act==='結'?p.act:'第'+p.act+'幕';
  $('pdate').textContent=p.date;$('ptitle').textContent=p.title;$('ptext').textContent=p.text;
  [...dots.children].forEach((b,k)=>{b.classList.toggle('on',k===cur);b.classList.toggle('done',k<cur);});
  setPlaying(true);
}
$('prev').onclick=()=>go(cur-1);
$('next').onclick=()=>go(cur+1);
$('play').onclick=()=>{if(!playing&&cur===PH.length-1&&tIn>=DUR){go(0);return;}setPlaying(!playing);};
$('speed').onclick=()=>{speed=speed===1?2:speed===2?0.5:1;$('speed').textContent=(speed===0.5?'0.5':speed)+'×';};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();$('play').click();}
  else if(e.code==='ArrowRight')go(cur+1);else if(e.code==='ArrowLeft')go(cur-1);
});
const ptrs=new Map();let pinch0=0,zoom0=1;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=tZoom;}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){tYaw-=(e.clientX-p.x)*0.005;tPitch+=(e.clientY-p.y)*0.004;tPitch=clamp(tPitch,-1.2,1.2);}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)tZoom=clamp(zoom0*pinch0/d,0.3,2.4);}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();tZoom=clamp(tZoom*Math.exp(e.deltaY*0.001),0.3,2.4);},{passive:false});
canvas.addEventListener('dblclick',()=>{tYaw=0;tPitch=0;tZoom=1;});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?58:42;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

go(0);
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;time+=dt;
  if(playing){tIn+=dt*speed;if(tIn>=DUR){if(cur<PH.length-1)go(cur+1);else{tIn=DUR;setPlaying(false);}}}
  tInG=tIn;
  const p=clamp((tIn-0.8)/(DUR*0.72),0,1);
  for(const u of units)u.update(cur,p,dt,time);
  for(const a of arrows)a.update(cur,tIn,dt);
  chev.offset.x-=dt*0.9;
  updFx(cur,tIn,dt);

  // 環境（夜・霧・昼・夕）
  const E=ENV[cur],et=ease(clamp(tIn/(cur===2?DUR*0.6:3.2),0,1));
  envNow.bg.copy(envFrom.bg).lerp(tc1.set(E.bg),et);
  envNow.sunC.copy(envFrom.sunC).lerp(tc2.set(E.sunC),et);
  envNow.fn=lerp(envFrom.fn,E.fn,et);envNow.ff=lerp(envFrom.ff,E.ff,et);
  envNow.sun=lerp(envFrom.sun,E.sun,et);envNow.hemi=lerp(envFrom.hemi,E.hemi,et);
  scene.background.copy(envNow.bg);scene.fog.color.copy(envNow.bg);scene.fog.near=envNow.fn;scene.fog.far=envNow.ff;
  sun.intensity=envNow.sun;sun.color.copy(envNow.sunC);hemi.intensity=envNow.hemi;
  document.body.style.background='#'+envNow.bg.getHexString();

  const k=CAM[cur],ct=ease(clamp(tIn/(reduceMotion?0.01:3.8),0,1));
  camNow.t=[0,1,2].map(i=>lerp(camFrom.t[i],k.t[i],ct));
  camNow.d=lerp(camFrom.d,k.d,ct);
  camNow.yaw=camFrom.yaw+wrapA(k.yaw-camFrom.yaw)*ct+(reduceMotion?0:tIn*0.01*ct);
  camNow.pitch=lerp(camFrom.pitch,k.pitch,ct);
  const f=Math.min(1,dt*6);uYaw+=(tYaw-uYaw)*f;uPitch+=(tPitch-uPitch)*f;uZoom+=(tZoom-uZoom)*f;
  const yaw=camNow.yaw+uYaw,pitch=clamp(camNow.pitch+uPitch,0.12,1.45),d=camNow.d*uZoom,T=camNow.t;
  const cx=T[0]+Math.sin(yaw)*Math.cos(pitch)*d,cz=T[2]+Math.cos(yaw)*Math.cos(pitch)*d;
  const cyy=Math.max(T[1]+Math.sin(pitch)*d,gy(cx,cz)+6);
  camera.position.set(cx,cyy,cz);camera.lookAt(T[0],T[1],T[2]);
  sun.target.position.set(T[0],0,T[2]);sun.position.set(T[0]-90,150,T[2]+70);

  $('prog').style.width=(clamp(tIn/DUR,0,1)*100)+'%';
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const ld=$('loading');ld.style.opacity=0;setTimeout(()=>ld.remove(),900);
}

let started=false;const start=()=>{if(started)return;started=true;try{init();}catch(e){$('loading').textContent='表示に失敗しました：'+e.message;}};
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 46px "Shippori Mincho"'),document.fonts.load('500 46px "Noto Sans JP"')]).then(start,start);}
setTimeout(start,2500);
if(!document.fonts)start();
})();
</script>
</body>
