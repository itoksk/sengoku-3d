<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>諏訪原城の戦い 3D俯瞰デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(238,240,235,0.9);
  --ink:#1c2026; --sub:#4d5560; --rule:rgba(28,32,38,.16);
  --kin:#9a7a2c; --shu:#b8231b; --ai:#2848a0;
  --btn:rgba(28,32,38,.07); --btnh:rgba(28,32,38,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel: rgba(20,23,28,0.86);
    --ink:#eef0ea; --sub:#a9b0b8; --rule:rgba(238,240,234,.14);
    --kin:#d4b25e; --shu:#e25a4c; --ai:#7f9cf0;
    --btn:rgba(255,255,255,.08); --btnh:rgba(255,255,255,.16);
  }
}
:root[data-theme="dark"]{
  --panel: rgba(20,23,28,0.86);
  --ink:#eef0ea; --sub:#a9b0b8; --rule:rgba(238,240,234,.14);
  --kin:#d4b25e; --shu:#e25a4c; --ai:#7f9cf0;
  --btn:rgba(255,255,255,.08); --btnh:rgba(255,255,255,.16);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:#cdd5d6;color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:6px;pointer-events:auto;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.title{padding:12px 16px 12px 14px;border-left:4px solid var(--kin);max-width:min(420px,60vw)}
.title h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;
  font-size:clamp(20px,3.2vw,30px);letter-spacing:.08em;margin:0;line-height:1.2}
.title p{margin:4px 0 0;font-size:12px;color:var(--sub);line-height:1.5}
.title a{color:var(--sub)}
.legend{padding:10px 14px;font-size:12px;line-height:1.9;min-width:150px}
.legend .row{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:2px;flex:none}
.sw.ai{background:#2c4fb0}.sw.shu{background:#c0281f}
.sw.arr{width:18px;height:8px;background:linear-gradient(90deg,#2c4fb0 0 45%,transparent 45% 55%,#2c4fb0 55%);clip-path:polygon(0 0,80% 0,100% 50%,80% 100%,0 100%)}
.legend .hint{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule);color:var(--sub);font-size:11px;line-height:1.6}
.card{align-self:center;width:min(760px,100%);padding:14px 18px 12px}
.meta{display:flex;align-items:baseline;gap:12px;color:var(--sub);font-size:12px}
.meta .act{font-family:"Shippori Mincho",serif;font-weight:800;font-size:15px;color:var(--kin)}
.card h2{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;
  font-size:clamp(19px,2.6vw,25px);margin:4px 0 6px;letter-spacing:.05em}
.card p{margin:0;font-size:14px;line-height:1.8;min-height:3.6em;max-width:68ch}
.bar{height:3px;background:var(--rule);margin:12px 0 10px;border-radius:2px;overflow:hidden}
#prog{height:100%;width:0;background:var(--kin)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--btn);border:0;border-radius:4px;height:32px;min-width:36px;padding:0 10px;cursor:pointer}
button:hover{background:var(--btnh)}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
#dots{display:flex;gap:4px;flex:1;min-width:0}
#dots button{flex:1;min-width:0;height:32px;padding:0 4px;font-family:"Shippori Mincho",serif;font-weight:700;font-size:13px;color:var(--sub)}
#dots button.on{background:var(--kin);color:#fff}
#dots button.done{color:var(--ink)}
.note{font-size:11px;color:var(--sub);margin-top:8px}
#loading{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  background:#cdd5d6;font-family:"Shippori Mincho",serif;font-size:18px;color:#1c2026;letter-spacing:.2em;transition:opacity .8s}
@media (max-width:640px){
  .legend{display:none}
  .title{max-width:100%}
  .card{padding:12px 14px 10px}
  .card p{font-size:13px;line-height:1.7;min-height:0}
  #dots button{font-size:12px}
}
@media (prefers-reduced-motion: reduce){ #loading{transition:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="top">
    <div class="panel title">
      <h1>諏訪原城の戦い</h1>
      <p>天正3年（1575）　徳川家康による武田方・諏訪原城の攻略　<a href="../">一覧へ</a></p>
    </div>
    <div class="panel legend">
      <div class="row"><span class="sw ai"></span>徳川軍</div>
      <div class="row"><span class="sw shu"></span>武田軍</div>
      <div class="row"><span class="sw arr"></span>進軍・攻撃の方向</div>
      <div class="hint">ドラッグで視点を回転<br>ホイール・ピンチで拡大縮小<br>ダブルクリックで視点を戻す<br>Space で再生／停止</div>
    </div>
  </div>
  <div class="panel card">
    <div class="meta"><span class="act" id="pact"></span><span id="pdate"></span></div>
    <h2 id="ptitle"></h2>
    <p id="ptext"></p>
    <div class="bar"><div id="prog"></div></div>
    <div class="ctrl">
      <button id="prev" aria-label="前の場面">◀</button>
      <button id="play" aria-label="再生／停止">❚❚</button>
      <button id="next" aria-label="次の場面">▶</button>
      <div id="dots"></div>
      <button id="speed" aria-label="再生速度">1×</button>
    </div>
    <div class="note">地形の縮尺・軍勢の数と配置は、流れを理解するための概念的な再現です。</div>
  </div>
</div>
<div id="loading">地形を生成しています</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- 地形 ---------------- */
const CASTLE={x:2,z:-6}, HON={x:8,z:-6};
const WATER=1.6, SIZE=290, SEG=230;
function nz(x,z){return Math.sin(x*0.071+Math.sin(z*0.053)*1.3)*0.5+Math.sin(z*0.089+x*0.031)*0.5+Math.sin((x+z)*0.21)*0.22+Math.sin((x-z)*0.37)*0.1;}
const kikuX=z=>-48+10*Math.sin(z*0.025);
const oiX=z=>70+Math.sin(z*0.02)*5;
const edgeX=z=>22+Math.sin(z*0.05)*6+Math.sin(z*0.13)*2;
function H(x,z){
  const n=nz(x,z);
  let h=26+n*2.2;
  const e=edgeX(z);
  const s=smooth(e-4,e+10,x);
  h=h*(1-s)+(3.2+n*0.5)*s;
  const r=1-smooth(9,16,Math.abs(x-oiX(z)));
  h=h*(1-r)+(0.6+Math.max(0,nz(x*3.1,z*2.3))*1.9)*r;
  h+=smooth(95,120,x)*(12+n*4);
  const d=Math.abs(x-kikuX(z));
  h-=(1-smooth(3,22,d))*17;
  h=lerp(h,0.8,1-smooth(1.2,3.5,d));
  const dc=Math.hypot(x-CASTLE.x,z-CASTLE.z);
  const f=1-smooth(12,19,dc);
  return h*(1-f)+27*f;
}
const gy=(x,z)=>Math.max(H(x,z),WATER);
function surf(x,z){
  let y=gy(x,z);
  const d=Math.hypot(x-HON.x,z-HON.z);
  if(d<5.5) y+=1.4; else if(d<11) y+=0.7;
  return y;
}

function init(){
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xd9dcd2,210,560);
(function(){const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#86aed0');g.addColorStop(.55,'#c4d4dc');g.addColorStop(1,'#dcddd2');
  x.fillStyle=g;x.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(c);})();
const camera=new THREE.PerspectiveCamera(42,1,0.5,1600);

scene.add(new THREE.HemisphereLight(0xe2ebf3,0x6b5a3e,0.62));
const sun=new THREE.DirectionalLight(0xfff0d8,0.95);
sun.position.set(-90,140,70);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-150;sc.right=150;sc.top=150;sc.bottom=-150;sc.near=10;sc.far=450;
sun.shadow.bias=-0.0006;
scene.add(sun);scene.add(sun.target);

// terrain mesh
const tg=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);tg.rotateX(-Math.PI/2);
const tp=tg.attributes.position;
for(let i=0;i<tp.count;i++)tp.setY(i,H(tp.getX(i),tp.getZ(i)));
tg.computeVertexNormals();
const tn=tg.attributes.normal, col=new Float32Array(tp.count*3);
const C=h=>new THREE.Color(h);
const cG=C('#7a9350'),cG2=C('#94a55c'),cPl=C('#a4ae6c'),cCl=C('#86704f'),cSa=C('#cfc19b'),cCa=C('#8d9a5c'),tmp=new THREE.Color();
for(let i=0;i<tp.count;i++){
  const x=tp.getX(i),z=tp.getZ(i),h=tp.getY(i),slope=1-tn.getY(i);
  tmp.copy(cG).lerp(cG2,(nz(x*1.7+13,z*1.7)+1.3)/2.6);
  tmp.lerp(cPl,smooth(7,3.5,h)*0.8);
  tmp.lerp(cSa,(1-smooth(10,17,Math.abs(x-oiX(z))))*0.95);
  tmp.lerp(cSa,(1-smooth(1.6,4.2,Math.abs(x-kikuX(z))))*0.8);
  tmp.lerp(cCa,(1-smooth(10,14,Math.hypot(x-CASTLE.x,z-CASTLE.z)))*0.6);
  tmp.lerp(cCl,smooth(0.22,0.5,slope));
  col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
}
tg.setAttribute('color',new THREE.BufferAttribute(col,3));
const terrain=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.96,metalness:0}));
terrain.receiveShadow=true;scene.add(terrain);
const water=new THREE.Mesh(new THREE.PlaneGeometry(SIZE,SIZE).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x5a8ca3,roughness:.22,metalness:.15,transparent:true,opacity:.88}));
water.position.y=WATER;water.receiveShadow=true;scene.add(water);

/* ---------------- リボン（街道・矢印） ---------------- */
function ribbon(pts,width,lift,N){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])),false,'centripetal');
  const P=[];for(let i=0;i<=N;i++)P.push(curve.getPointAt(i/N));
  const acc=[0];for(let i=1;i<=N;i++)acc.push(acc[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].z-P[i-1].z));
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=N;i++){
    const a=P[Math.max(i-1,0)],b=P[Math.min(i+1,N)];
    let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    const cy=surf(P[i].x,P[i].z);P[i].y=cy+lift;
    for(const sg of[-1,1]){
      const x=P[i].x-tz*width/2*sg,z=P[i].z+tx*width/2*sg;
      pos.push(x,Math.max(surf(x,z),cy)+lift,z);
      uv.push(acc[i]/(width*2),sg<0?0:1);
    }
  }
  for(let i=0;i<N;i++){const a=2*i,b=a+1,c=a+2,d=a+3;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  return {g,P,N};
}
// 東海道
const ROAD=[[-150,-32],[-100,-30],[-70,-26],[-50,-24],[-30,-22],[-12,-21],[4,-19],[16,-18],[26,-17],[36,-15],[46,-14],[60,-12],[80,-11],[110,-12],[150,-14]];
const road=ribbon(ROAD,1.3,0.25,320);
scene.add(new THREE.Mesh(road.g,new THREE.MeshLambertMaterial({color:0xcbb98c,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1})));

/* ---------------- ラベル ---------------- */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function makeLabel(text,o={}){
  const fs=o.fs||46,font=`${o.weight||700} ${fs}px ${o.family||'"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif'}`;
  const c=document.createElement('canvas'),x=c.getContext('2d');x.font=font;
  const w=Math.ceil(x.measureText(text).width+fs*1.0),h=Math.ceil(fs*1.6);
  c.width=w;c.height=h;x.font=font;
  x.fillStyle=o.bg||'rgba(22,24,28,.74)';rr(x,2,2,w-4,h-4,o.round==null?6:o.round);x.fill();
  if(o.stroke){x.strokeStyle=o.stroke;x.lineWidth=4;x.stroke();}
  x.fillStyle=o.fg||'#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(text,w/2,h/2+fs*0.05);
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;
  const m=new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,depthWrite:false,sizeAttenuation:false});
  const s=new THREE.Sprite(m);const sz=o.size||0.032;s.scale.set(sz*w/h,sz,1);s.center.set(0.5,0);s.renderOrder=20;return s;
}
function place(text,x,z,o={},dy=5){const s=makeLabel(text,o);s.position.set(x,gy(x,z)+dy,z);scene.add(s);return s;}
const dirStyle={bg:'rgba(245,244,238,.82)',fg:'#20242a',size:0.027,weight:500,family:'"Noto Sans JP",sans-serif'};
const waterStyle={bg:'rgba(34,78,104,.78)',size:0.03};
const landStyle={bg:'rgba(62,70,40,.72)',size:0.03};
place('大井川',72,38,waterStyle,2);
place('菊川',kikuX(40),40,waterStyle,2);
place('牧之原台地',-18,58,landStyle,3);
place('東海道',-86,-29,{bg:'rgba(120,98,54,.8)',size:0.026},2);
place('金谷',46,-12,{bg:'rgba(22,24,28,.7)',size:0.026},4);
place('← 掛川・浜松方面',-112,-10,dirStyle,4);
place('駿河方面 →',116,-13,dirStyle,4);
place('↘ 小山城方面',96,96,dirStyle,4);
place('↙ 高天神城方面',-98,100,dirStyle,4);

/* ---------------- 城 ---------------- */
const castle=new THREE.Group();scene.add(castle);
const earthM=new THREE.MeshStandardMaterial({color:0x8e9a5a,roughness:.95});
const bankM=new THREE.MeshStandardMaterial({color:0x7c8c4c,roughness:.95});
const moatM=new THREE.MeshStandardMaterial({color:0x4a4232,roughness:1,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
const cy0=27;
function disc(x,z,r,h,y,m){const g=new THREE.CylinderGeometry(r,r*1.06,h,48);const me=new THREE.Mesh(g,m);me.position.set(x,y+h/2,z);me.castShadow=me.receiveShadow=true;castle.add(me);return me;}
function crescent(x,z,r,w,y){
  const g=new THREE.RingGeometry(r-w/2,r+w/2,56,1,Math.PI/2,Math.PI);g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,moatM);m.position.set(x,y+0.03,z);m.receiveShadow=true;castle.add(m);
  const tg=new THREE.TorusGeometry(r-w/2-0.45,0.42,6,48,Math.PI);tg.rotateZ(Math.PI/2);tg.rotateX(-Math.PI/2);tg.scale(1,0.8,1);
  const t=new THREE.Mesh(tg,bankM);t.position.set(x,y+0.1,z);t.castShadow=true;castle.add(t);
}
disc(HON.x,HON.z,11,0.7,cy0,earthM);
disc(HON.x,HON.z,5.5,0.7,cy0+0.7,earthM);
crescent(HON.x,HON.z,6.3,1.4,cy0+0.7);
crescent(HON.x,HON.z,11.9,1.6,cy0);
const UMA=[];
for(const a of[-0.45,0,0.45]){
  const r=14.6,x=HON.x-r*Math.cos(a),z=HON.z+r*Math.sin(a);UMA.push([x,z]);
  const g=new THREE.CylinderGeometry(2.5,2.7,0.9,32,1,false,Math.PI,Math.PI);
  const m=new THREE.Mesh(g,earthM);m.position.set(x+0.6,cy0+0.45,z);m.castShadow=m.receiveShadow=true;castle.add(m);
  crescent(x+0.6,z,3.6,1.2,cy0);
}
// 櫓・柵
const wallM=new THREE.MeshStandardMaterial({color:0xe6dfcc,roughness:.8});
const roofM=new THREE.MeshStandardMaterial({color:0x3a352f,roughness:.7});
const woodM=new THREE.MeshStandardMaterial({color:0x6b4f33,roughness:.9});
const yag=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.8,2.4),wallM);yag.position.set(HON.x+1.5,cy0+1.4+0.9,HON.z);yag.castShadow=true;castle.add(yag);
const roof=new THREE.Mesh(new THREE.ConeGeometry(2.3,1.3,4),roofM);roof.rotation.y=Math.PI/4;roof.position.set(HON.x+1.5,cy0+1.4+2.45,HON.z);roof.castShadow=true;castle.add(roof);
for(let i=0;i<34;i++){const a=Math.PI/2+i/33*Math.PI;const p=new THREE.Mesh(new THREE.BoxGeometry(.18,.9,.18),woodM);
  p.position.set(HON.x+Math.cos(a)*5.2,cy0+1.4+.45,HON.z-Math.sin(a)*5.2);p.castShadow=true;castle.add(p);}
// 旗
function flagTex(side){
  const c=document.createElement('canvas');c.width=64;c.height=160;const x=c.getContext('2d');
  if(side==='T'){x.fillStyle='#b8231b';x.fillRect(0,0,64,160);x.fillStyle='#fff';const cx=32,cy=46,s=8.5;
    [[0,-1],[-1,0],[1,0],[0,1]].forEach(([dx,dy])=>{const px=cx+dx*s*1.05,py=cy+dy*s*1.05;x.beginPath();x.moveTo(px,py-s);x.lineTo(px+s*.78,py);x.lineTo(px,py+s);x.lineTo(px-s*.78,py);x.closePath();x.fill();});}
  else{x.fillStyle='#f3f0e6';x.fillRect(0,0,64,160);x.strokeStyle='#1d1d1d';x.lineWidth=4;x.beginPath();x.arc(32,46,19,0,Math.PI*2);x.stroke();
    x.fillStyle='#1d1d1d';for(let k=0;k<3;k++){const a=-Math.PI/2+k*2*Math.PI/3;x.beginPath();x.ellipse(32+Math.cos(a)*8,46+Math.sin(a)*8,5.5,8,a+Math.PI/2,0,Math.PI*2);x.fill();}
    x.fillStyle='#2848a0';x.fillRect(0,0,64,9);}
  const t=new THREE.CanvasTexture(c);return t;

    this.shadow=new THREE.Mesh(r2.g,this.smat);this.shadow.renderOrder=3;scene.add(this.shadow);
    const hg=new THREE.BufferGeometry();const L=width*1.9,W=width*1.15;

  }
  update(cur,tIn,dt){
    const on=cur>=this.from&&cur<=this.until;
    if(on)this.prog=cur>this.from?1:ease(clamp((tIn-0.5)/3.2,0,1));
    else if(cur<this.from)this.prog=0;
    this.op+=((on?1:0)-this.op)*Math.min(1,dt*3);
    const vis=this.op>0.01&&this.prog>0.005;
    this.mesh.visible=this.shadow.visible=this.head.visible=vis;
    if(!vis)return;
    this.mat.opacity=0.95*this.op;this.smat.opacity=0.22*this.op;this.hmat.opacity=this.op;
    const k=Math.max(1,Math.floor(this.prog*this.N));
    this.mesh.geometry.setDrawRange(0,k*6);this.shadow.geometry.setDrawRange(0,k*6);
    const p=this.P[k],q=this.P[k-1];
    this.head.position.set(p.x,p.y+0.05,p.z);this.head.rotation.y=Math.atan2(-(p.z-q.z),p.x-q.x);
  }

class Unit{
  constructor(d){
    this.d=d;const isT=d.side==='T';
    this.g=new THREE.Group();scene.add(this.g);
    const rows=d.rows,cols=d.cols,sp=.82;this.offs=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)this.offs.push([(c-(cols-1)/2)*sp+(r%2?.2:0),(r-(rows-1)/2)*sp]);
    const n=this.offs.length;
    this.mats=[];const M=o=>{const m=new THREE.MeshStandardMaterial(Object.assign({transparent:true,roughness:.7},o));this.mats.push(m);return m;};
    this.body=new THREE.InstancedMesh(new THREE.BoxGeometry(.44,.86,.36),M({color:isT?0x8a2219:0x2b3f78}),n);
    this.helm=new THREE.InstancedMesh(new THREE.ConeGeometry(.3,.28,6),M({color:0x2a2622}),n);
    this.spear=new THREE.InstancedMesh(new THREE.BoxGeometry(.05,2,.05),M({color:0x8a6a40}),n);
    for(const m of[this.body,this.helm,this.spear]){m.castShadow=true;m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);this.g.add(m);}
    const back=-(rows-1)/2*sp-.6,pm=M({color:0x6b4f33}),fm=M({map:isT?TEX_T:TEX_K,side:THREE.DoubleSide,roughness:.85});
    this.flags=[];
    for(const k of d.flags||[-1,0,1]){
      const x=k*(cols-1)/2*sp*.8;
      const p=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,3),pm);p.position.set(x,1.5,back);p.castShadow=true;this.g.add(p);
      const fg=new THREE.PlaneGeometry(.6,1.45);fg.translate(.3,0,0);const f=new THREE.Mesh(fg,fm);f.position.set(x+.04,2.2,back);f.castShadow=true;this.g.add(f);this.flags.push(f);
    }
    this.label=makeLabel(d.name,{bg:isT?'rgba(150,26,20,.86)':'rgba(34,58,138,.86)',size:0.024,weight:700});
    this.label.position.y=4.3;this.g.add(this.label);this.mats.push(this.label.material);
    // keyframes
    this.polys=[];this.ends=[];let last=null;this.first=null;
    d.keys.forEach((k,i)=>{
      if(k==null){this.polys.push(null);this.ends.push(last);return;}
      const pts=Array.isArray(k[0])?k:[k];if(!this.first)this.first=pts[0];
      let poly=last?[last,...pts]:pts.slice();if(poly.length===1)poly=[poly[0],poly[0]];
      this.polys.push(poly);last=pts[pts.length-1];this.ends.push(last);
    });
    this.x=null;this.yaw=d.face||0;this.op=0;this.dummy=new THREE.Object3D();
  }
  posAt(ph,p){
    const poly=this.polys[ph];
    if(!poly){const e=this.ends[ph]||this.first;return{x:e[0],z:e[1],vis:false};}
    const L=[0];for(let i=1;i<poly.length;i++)L.push(L[i-1]+Math.hypot(poly[i][0]-poly[i-1][0],poly[i][1]-poly[i-1][1]));
    const tot=L[L.length-1];if(tot<1e-6)return{x:poly[0][0],z:poly[0][1],vis:true};
    const s=ease(p)*tot;let i=1;while(i<L.length-1&&L[i]<s)i++;
    const t=(s-L[i-1])/((L[i]-L[i-1])||1);
    return{x:lerp(poly[i-1][0],poly[i][0],t),z:lerp(poly[i-1][1],poly[i][1],t),vis:true};
  }
  update(ph,p,dt,time){
    const r=this.posAt(ph,p);
    let moving=false;
    if(this.x==null){this.x=r.x;this.z=r.z;}
    const dx=r.x-this.x,dz=r.z-this.z,dist=Math.hypot(dx,dz);
    let ty=this.yaw;
    if(dist>8){/* 場面ジャンプ */}
    else if(dist/Math.max(dt,1e-3)>0.35){ty=Math.atan2(dx,dz);moving=true;}
    else if(this.d.side==='T')ty=this.d.face;
    else if(Math.hypot(CASTLE.x-r.x,CASTLE.z-r.z)>5)ty=Math.atan2(CASTLE.x-r.x,CASTLE.z-r.z);
    this.x=r.x;this.z=r.z;
    this.yaw+=wrapA(ty-this.yaw)*Math.min(1,dt*3);
    this.op+=((r.vis?1:0)-this.op)*Math.min(1,dt*2.5);
    this.g.visible=this.op>0.02;if(!this.g.visible)return;
    for(const m of this.mats)m.opacity=this.op;
    const by=surf(this.x,this.z);this.g.position.set(this.x,by,this.z);this.g.rotation.y=this.yaw;
    const cs=Math.cos(this.yaw),sn=Math.sin(this.yaw),D=this.dummy;
    this.offs.forEach((o,i)=>{
      const wx=this.x+o[0]*cs+o[1]*sn,wz=this.z-o[0]*sn+o[1]*cs;
      const ly=surf(wx,wz)-by+(moving&&!reduceMotion?Math.abs(Math.sin(time*9+i*1.7))*.13:0);
      D.position.set(o[0],ly+.43,o[1]);D.updateMatrix();this.body.setMatrixAt(i,D.matrix);
      D.position.set(o[0],ly+1.0,o[1]);D.updateMatrix();this.helm.setMatrixAt(i,D.matrix);
      D.position.set(o[0]+.27,ly+1.1,o[1]+.05);D.updateMatrix();this.spear.setMatrixAt(i,D.matrix);
    });
    this.body.instanceMatrix.needsUpdate=this.helm.instanceMatrix.needsUpdate=this.spear.instanceMatrix.needsUpdate=true;
    this.flags.forEach((f,i)=>{f.rotation.y=Math.sin(time*2.2+i)*.25;});
  }
}

const CAM=[
  {t:[5,8,5],d:205,yaw:-0.35,pitch:0.95},
  {t:[10,6,40],d:225,yaw:0.25,pitch:1.05},
  {t:[-64,14,-6],d:118,yaw:-0.55,pitch:0.62},
  {t:[-10,24,-6],d:84,yaw:-0.95,pitch:0.78},
  {t:[-6,27,-5],d:48,yaw:-1.35,pitch:0.5},
  {t:[42,12,34],d:128,yaw:0.55,pitch:0.8},
  {t:[4,27,-6],d:74,yaw:0.85,pitch:0.72},
];
const DUR=13;
let cur=0,tIn=0,playing=true,speed=1,time=0;
let camNow={t:[5,8,5],d:360,yaw:-0.95,pitch:1.28},camFrom={...camNow,t:camNow.t.slice()};
let uYaw=0,uPitch=0,uZoom=1,tYaw=0,tPitch=0,tZoom=1;

const dots=$('dots');
PH.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.act;b.setAttribute('aria-label',p.title);b.onclick=()=>go(i);dots.appendChild(b);});
function setPlaying(v){playing=v;$('play').textContent=v?'❚❚':'▶︎';}
function go(i){
  cur=clamp(i,0,PH.length-1);tIn=0;camFrom={t:camNow.t.slice(),d:camNow.d,yaw:camNow.yaw,pitch:camNow.pitch};
  const p=PH[cur];$('pact').textContent=p.act==='序'||p.act==='結'?p.act:'第'+p.act+'幕';
  $('pdate').textContent=p.date;$('ptitle').textContent=p.title;$('ptext').textContent=p.text;
  [...dots.children].forEach((b,k)=>{b.classList.toggle('on',k===cur);b.classList.toggle('done',k<cur);});
  setPlaying(true);
}
$('prev').onclick=()=>go(cur-1);
$('next').onclick=()=>go(cur+1);
$('play').onclick=()=>{if(!playing&&cur===PH.length-1&&tIn>=DUR){go(0);return;}setPlaying(!playing);};
$('speed').onclick=()=>{speed=speed===1?2:speed===2?0.5:1;$('speed').textContent=(speed===0.5?'0.5':speed)+'×';};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();$('play').click();}
  else if(e.code==='ArrowRight')go(cur+1);else if(e.code==='ArrowLeft')go(cur-1);
});

// 視点操作
const ptrs=new Map();let pinch0=0,zoom0=1;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=tZoom;}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){tYaw-=(e.clientX-p.x)*0.005;tPitch+=(e.clientY-p.y)*0.004;tPitch=clamp(tPitch,-1.2,1.2);}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)tZoom=clamp(zoom0*pinch0/d,0.35,2.4);}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();tZoom=clamp(tZoom*Math.exp(e.deltaY*0.001),0.35,2.4);},{passive:false});
canvas.addEventListener('dblclick',()=>{tYaw=0;tPitch=0;tZoom=1;});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<h?58:42;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

go(0);
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;time+=dt;
  if(playing){tIn+=dt*speed;if(tIn>=DUR){if(cur<PH.length-1)go(cur+1);else{tIn=DUR;setPlaying(false);}}}
  const p=clamp((tIn-0.8)/(DUR*0.72),0,1);
  for(const u of units)u.update(cur,p,dt,time);
  for(const a of arrows)a.update(cur,tIn,dt);
  chev.offset.x-=dt*0.9;
  for(const f of forts){const tgt=cur>=3?1:0;f.op+=(tgt-f.op)*Math.min(1,dt*2);for(const m of f.mats)m.opacity=f.op;f.g.visible=f.op>0.02;}
  const isMaki=cur===6&&tIn>2.5;
  cflagM.map=isMaki?TEX_K:TEX_T;
  lblSuwa.material.opacity+=((isMaki?0:1)-lblSuwa.material.opacity)*Math.min(1,dt*3);
  lblMaki.material.opacity+=((isMaki?1:0)-lblMaki.material.opacity)*Math.min(1,dt*3);
  lblUma.material.opacity+=(((cur===0||cur===4)?1:0)-lblUma.material.opacity)*Math.min(1,dt*3);
  cflag.rotation.y=Math.sin(time*1.8)*.3;
  updFx(cur,tIn,dt);

  // カメラ
  const k=CAM[cur],ct=ease(clamp(tIn/(reduceMotion?0.01:3.6),0,1));
  camNow.t=[0,1,2].map(i=>lerp(camFrom.t[i],k.t[i],ct));
  camNow.d=lerp(camFrom.d,k.d,ct);
  camNow.yaw=camFrom.yaw+wrapA(k.yaw-camFrom.yaw)*ct+(reduceMotion?0:tIn*0.011*ct);
  camNow.pitch=lerp(camFrom.pitch,k.pitch,ct);
  const f=Math.min(1,dt*6);uYaw+=(tYaw-uYaw)*f;uPitch+=(tPitch-uPitch)*f;uZoom+=(tZoom-uZoom)*f;
  const yaw=camNow.yaw+uYaw,pitch=clamp(camNow.pitch+uPitch,0.12,1.45),d=camNow.d*uZoom;
  const T=camNow.t;
  let cx=T[0]+Math.sin(yaw)*Math.cos(pitch)*d,cz=T[2]+Math.cos(yaw)*Math.cos(pitch)*d,cyy=T[1]+Math.sin(pitch)*d;
  cyy=Math.max(cyy,gy(cx,cz)+6);
  camera.position.set(cx,cyy,cz);camera.lookAt(T[0],T[1],T[2]);
  sun.target.position.set(T[0],0,T[2]);sun.position.set(T[0]-90,140,T[2]+70);

  $('prog').style.width=(clamp(tIn/DUR,0,1)*100)+'%';
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const ld=$('loading');ld.style.opacity=0;setTimeout(()=>ld.remove(),900);
}

let started=false;const start=()=>{if(started)return;started=true;try{init();}catch(e){$('loading').textContent='表示に失敗しました：'+e.message;}};
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 46px "Shippori Mincho"'),document.fonts.load('500 46px "Noto Sans JP"')]).then(start,start);}
setTimeout(start,2500);
if(!document.fonts)start();
})();
</script>
</body>
</html>
